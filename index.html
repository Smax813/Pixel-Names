<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Names – Your Name, Pixel Perfect</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header>
<h1 class="sr">Pixel Names</h1>
<canvas id="title" aria-hidden="true"></canvas>
<p class="sub">Your Name, Pixel Perfect.</p>
<p class="lead">Type your name once, see it in nine languages.</p>
<div class="box">
<input id="name" type="text" maxlength="24" placeholder="Type your name…" autocomplete="off" aria-label="Your name">
<button class="go" id="go">Generate ✨</button>
</div>
<p class="hint" id="hint">Example: Samarth, Maria, Émile, Zoë</p>
</header>
<section id="results" aria-live="polite">
<div class="rh"><h2 id="rt"></h2><button class="all" id="all">⬇ Download all (one image)</button></div>
<div class="grid" id="grid"></div>
</section>
<footer>Names are written by sound, not translated. Spellings in other writing systems are phonetic approximations; people may spell the same name in different ways.</footer>
</main>
<div id="fs"><div id="fsp" role="dialog" aria-modal="true" aria-labelledby="fsl"><div id="fsh"><span class="dot" id="fsdot"></span><span id="fsl"></span><span id="fsn"></span><button id="fsx" aria-label="Close">✕</button></div><div id="fsa"><canvas id="fsc"></canvas></div><div id="fsf"><div id="fst"></div><button id="fsd" aria-label="Download PNG">⬇</button></div></div></div>
<div id="toast"></div>

  <script src="script.js" defer></script>
</body>
</html>
